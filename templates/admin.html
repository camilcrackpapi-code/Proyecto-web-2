<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - Mivith</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #021024; color: #fff; margin: 0; padding: 0; display: flex; }
        
        .sidebar { width: 250px; background-color: #052659; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #c1e8ff; margin-top: 0; font-size: 1.5em; border-bottom: 1px solid #5483b3; padding-bottom: 15px; }
        .menu-lateral { list-style: none; padding: 0; }
        .menu-lateral li { padding: 15px 0; border-bottom: 1px solid #5483b3; cursor: pointer; color: #7da0ca; }
        .menu-lateral li:hover, .menu-lateral li.activo { color: #c1e8ff; font-weight: bold; }

        .main-content { flex: 1; padding: 30px; }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5483b3; padding-bottom: 20px; margin-bottom: 30px; }
        .reloj { font-size: 1.2em; color: #7da0ca; font-weight: bold; }

        .ordenes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .orden-card { background: #ffffff; color: #021024; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); position: relative; border-top: 5px solid #c1e8ff; transition: all 0.3s ease; }
        .orden-card.completada { border-top-color: #27ae60; opacity: 0.65; background-color: #f8f9fa; }
        .cliente-tag { position: absolute; top: -15px; right: 20px; background: #052659; color: #c1e8ff; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cliente-info { font-size: 0.9em; color: #5483b3; margin-bottom: 15px; font-weight: bold; }
        .lista-platos { list-style: none; padding: 0; margin: 0 0 15px 0; font-size: 1em; font-weight: bold; }
        .lista-platos li { margin-bottom: 8px; border-bottom: 1px dashed #7da0ca; padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        .total-pedido { font-size: 1.1em; color: #27ae60; font-weight: bold; margin-bottom: 15px; text-align: right; }

        .btn-despachar { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 0.95em; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 5px; }
        .btn-despachar:hover { background: #219150; }
        
        .btn-despachar.btn-completado { background: #7f8c8d; }
        .btn-despachar.btn-completado:hover { background: #e74c3c; }

        .btn-eliminar { width: 100%; background: #e74c3c; color: white; border: none; padding: 6px; border-radius: 5px; font-size: 0.85em; font-weight: bold; cursor: pointer; opacity: 0.8; }
        .btn-eliminar:hover { opacity: 1; }

        .btn-limpiar-todo { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-limpiar-todo:hover { background: #c0392b; }
    </style>
</head>
<body>

    <script>
        // Verificación de Autenticación
        if (sessionStorage.getItem('adminAutenticado') !== 'true') {
            alert("Acceso denegado. Debes ingresar la contraseña desde el inicio.");
            window.location.href = "../index.html";
        }
    </script>

    <div class="sidebar">
        <h2>Mivith Admin</h2>
        <ul class="menu-lateral">
            <li class="activo">🔔 Órdenes Activas</li>
            <li onclick="cerrarSesion()">🚪 Cerrar Sesión</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-panel">
            <div>
                <h1 style="margin: 0;">Monitor de Cocina (Comandas)</h1>
                <p style="margin: 5px 0 0 0; color: #7da0ca;">Pedidos recibidos desde el menú web</p>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="btn-limpiar-todo" onclick="limpiarTodosLosPedidos()">🗑️ Borrar Historial</button>
                <div class="reloj" id="reloj">--:--:--</div>
            </div>
        </div>

        <div class="ordenes-grid" id="contenedorOrdenes"></div>
    </div>

    <script>
        // Cargar pedidos almacenados localmente o iniciar array vacío
        let ordenesPendientes = JSON.parse(localStorage.getItem('pedidosMivith')) || [];

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        function renderizarOrdenes() {
            const contenedor = document.getElementById('contenedorOrdenes');
            
            if (ordenesPendientes.length === 0) {
                contenedor.innerHTML = '<h3 style="color: #7da0ca; grid-column: 1/-1; text-align: center;">No hay pedidos registrados en este momento.</h3>';
                return;
            }

            let acumuladoHTML = '';

            ordenesPendientes.forEach((orden, index) => {
                let itemsHTML = '';
                let totalPedido = 0;

                // Adaptador para estructura de platos (soporta tanto 'platos' como 'items')
                const listaItems = orden.items || orden.platos || [];
                
                listaItems.forEach(p => {
                    const cantidad = p.cantidad || p.cant || 1;
                    const precio = p.precio ? `($${(p.precio * cantidad).toLocaleString('es-CO')})` : '';
                    itemsHTML += `<li><span>${cantidad}x ${p.nombre}</span> <small>${precio}</small></li>`;
                });

                const estaCompletada = orden.completada || false;
                const cliente = orden.cliente || orden.mesa || 'Cliente';
                const hora = orden.fecha || orden.hora || 'Ahora';
                const total = orden.total ? `$${orden.total.toLocaleString('es-CO')} COP` : '';

                acumuladoHTML += `
                    <div class="orden-card ${estaCompletada ? 'completada' : ''}">
                        <div class="cliente-tag">👤 ${cliente}</div>
                        <h3 style="margin-top: 0; color: #052659;">Orden #${index + 1}</h3>
                        <div class="cliente-info">🕒 Recibido: ${hora}</div>
                        <ul class="lista-platos">
                            ${itemsHTML}
                        </ul>
                        ${total ? `<div class="total-pedido">Total: ${total}</div>` : ''}
                        <button class="btn-despachar ${estaCompletada ? 'btn-completado' : ''}" 
                                onclick="alternarEstadoOrden(${index})">
                            ${estaCompletada ? '✓ Completado (Deshacer)' : 'Despachar Pedido ✓'}
                        </button>
                        <button class="btn-eliminar" onclick="eliminarOrden(${index})">Eliminar Comanda</button>
                    </div>
                `;
            });

            contenedor.innerHTML = acumuladoHTML;
        }

        function alternarEstadoOrden(index) {
            ordenesPendientes[index].completada = !ordenesPendientes[index].completada;
            guardarYRenderizar();
        }

        function eliminarOrden(index) {
            if (confirm("¿Estás seguro de eliminar esta comanda?")) {
                ordenesPendientes.splice(index, 1);
                guardarYRenderizar();
            }
        }

        function limpiarTodosLosPedidos() {
            if (confirm("⚠️ ¿Deseas borrar TODOS los pedidos recibidos?")) {
                ordenesPendientes = [];
                guardarYRenderizar();
            }
        }

        function guardarYRenderizar() {
            localStorage.setItem('pedidosMivith', JSON.stringify(ordenesPendientes));
            renderizarOrdenes();
        }

        function buscarNuevasOrdenes() {
            // Sincroniza pedidos si se agrega uno nuevo en otra pestaña/dispositivo local
            ordenesPendientes = JSON.parse(localStorage.getItem('pedidosMivith')) || [];
            renderizarOrdenes(); 
        }

        function cerrarSesion() {
            sessionStorage.removeItem('adminAutenticado');
            window.location.href = "../index.html";
        }

        // Cargar e iniciar actualización automática cada 3 segundos
        renderizarOrdenes();
        setInterval(buscarNuevasOrdenes, 3000);
    </script>
</body>
</html>
