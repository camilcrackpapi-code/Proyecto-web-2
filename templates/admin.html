<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - La Cocina Deliciosa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #021024; color: #fff; margin: 0; padding: 0; display: flex; }
        
        /* Barra lateral */
        .sidebar { width: 250px; background-color: #052659; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #c1e8ff; margin-top: 0; font-size: 1.5em; border-bottom: 1px solid #5483b3; padding-bottom: 15px; }
        .menu-lateral { list-style: none; padding: 0; }
        .menu-lateral li { padding: 15px 0; border-bottom: 1px solid #5483b3; cursor: pointer; color: #7da0ca; }
        .menu-lateral li:hover, .menu-lateral li.activo { color: #c1e8ff; font-weight: bold; }

        /* Área principal */
        .main-content { flex: 1; padding: 30px; }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5483b3; padding-bottom: 20px; margin-bottom: 30px; }
        .reloj { font-size: 1.2em; color: #7da0ca; font-weight: bold; }

        /* Grid y tarjetas */
        .ordenes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .orden-card { background: #ffffff; color: #021024; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); position: relative; border-top: 5px solid #c1e8ff; transition: all 0.3s ease; }
        .orden-card.completada { border-top-color: #27ae60; opacity: 0.65; background-color: #f8f9fa; }
        .mesa-tag { position: absolute; top: -15px; right: 20px; background: #052659; color: #c1e8ff; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1.2em; }
        .cliente-info { font-size: 0.9em; color: #7da0ca; margin-bottom: 15px; }
        .lista-platos { list-style: none; padding: 0; margin: 0 0 20px 0; font-size: 1.1em; font-weight: bold; }
        .lista-platos li { margin-bottom: 8px; border-bottom: 1px dashed #7da0ca; padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        /* Botón de acción con estados dinámicos */
        .btn-despachar { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 0.95em; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-despachar:hover { background: #219150; }
        
        /* Estilo cuando la orden está completada (permite deshacer) */
        .btn-despachar.btn-completado { background: #7f8c8d; }
        .btn-despachar.btn-completado:hover { background: #e74c3c; } /* Se vuelve rojo al pasar el mouse para indicar que se revertirá */
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Panel Admin</h2>
        <ul class="menu-lateral">
            <li class="activo">🔔 Órdenes Activas</li>
            <li>📊 Historial y Ventas</li>
            <li>⚙️ Configurar Menú</li>
            <li>🚪 Cerrar Sesión</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-panel">
            <h1>Monitor de Cocina (Comandas)</h1>
            <div class="reloj" id="reloj">--:--:--</div>
        </div>

        <div class="ordenes-grid" id="contenedorOrdenes"></div>
    </div>

    <script>
        let ordenesPendientes = [
            { id: 1, mesa: "5", cliente: "Carlos Pérez", hora: "14:30", completada: false, platos: [{nombre: "Hamburguesa Artesanal", cant: 2}, {nombre: "Limonada", cant: 2}] },
            { id: 2, mesa: "2", cliente: "Ana Gómez", hora: "14:32", completada: false, platos: [{nombre: "Pasta Alfredo", cant: 1}] }
        ];

        // Reloj en tiempo real
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Renderizado dinámico de comandas
        function renderizarOrdenes() {
            const contenedor = document.getElementById('contenedorOrdenes');
            let acumuladoHTML = '';

            ordenesPendientes.forEach(orden => {
                let itemsHTML = '';
                orden.platos.forEach(p => {
                    itemsHTML += `<li><span>${p.cant}x ${p.nombre}</span></li>`;
                });

                const estaCompletada = orden.completada;

                acumuladoHTML += `
                    <div class="orden-card ${estaCompletada ? 'completada' : ''}" id="orden-${orden.id}">
                        <div class="mesa-tag">Mesa ${orden.mesa}</div>
                        <h3 style="margin-top: 0;">Orden #${orden.id}</h3>
                        <div class="cliente-info">👤 ${orden.cliente} | 🕒 ${orden.hora}</div>
                        <ul class="lista-platos">
                            ${itemsHTML}
                        </ul>
                        <button class="btn-despachar ${estaCompletada ? 'btn-completado' : ''}" 
                                onclick="alternarEstadoOrden(${orden.id})">
                            ${estaCompletada ? '✓ Completado (Clic para deshacer)' : 'Despachar Pedido ✓'}
                        </button>
                    </div>
                `;
            });

            contenedor.innerHTML = acumuladoHTML;
        }

        // Función que conmuta el estado entre Completado / Pendiente
        function alternarEstadoOrden(id) {
            const orden = ordenesPendientes.find(o => o.id === id);
            if (orden) {
                // Invierte el estado (si era false pasa a true y viceversa)
                orden.completada = !orden.completada; 
                renderizarOrdenes(); // Redibuja con el nuevo estado
            }
        }

        function buscarNuevasOrdenes() {
            renderizarOrdenes(); 
        }

        renderizarOrdenes();
        setInterval(buscarNuevasOrdenes, 5000);
    </script>
</body>
</html>
