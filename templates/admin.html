<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - Mivith</title>
    
</head>
<body>

    <script>
        if (sessionStorage.getItem('adminAutenticado') !== 'true') {
            alert("Acceso denegado. Debes ingresar la contraseña desde el inicio.");
            window.location.href = "../index.html";
        }
    </script>

    <div class="sidebar">
        <h2>Mivith Admin</h2>
        <ul class="menu-lateral">
            <li class="activo">🔔 Órdenes Activas</li>
            <li onclick="cerrarSesion()">🚪 Cerrar Sesión</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-panel">
            <div>
                <h1 style="margin: 0;">Monitor de Cocina (Comandas)</h1>
                <p style="margin: 5px 0 0 0; color: #7da0ca;">Pedidos recibidos desde el menú web</p>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="btn-limpiar-todo" onclick="limpiarTodosLosPedidos()">🗑️ Borrar Historial</button>
                <div class="reloj" id="reloj">--:--:--</div>
            </div>
        </div>

        <div class="ordenes-grid" id="contenedorOrdenes"></div>
    </div>

    <script>
        let ordenesPendientes = JSON.parse(localStorage.getItem('pedidosMivith')) || [];

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        function renderizarOrdenes() {
            const contenedor = document.getElementById('contenedorOrdenes');
            
            if (ordenesPendientes.length === 0) {
                contenedor.innerHTML = '<h3 style="color: #7da0ca; grid-column: 1/-1; text-align: center;">No hay pedidos registrados en este momento.</h3>';
                return;
            }

            let acumuladoHTML = '';

            ordenesPendientes.forEach((orden, index) => {
                let itemsHTML = '';
                let totalPedido = 0;

                const listaItems = orden.items || orden.platos || [];
                
                listaItems.forEach(p => {
                    const cantidad = p.cantidad || p.cant || 1;
                    const precio = p.precio ? `($${(p.precio * cantidad).toLocaleString('es-CO')})` : '';
                    itemsHTML += `<li><span>${cantidad}x ${p.nombre}</span> <small>${precio}</small></li>`;
                });

                const estaCompletada = orden.completada || false;
                const cliente = orden.cliente || orden.mesa || 'Cliente';
                const hora = orden.fecha || orden.hora || 'Ahora';
                const total = orden.total ? `$${orden.total.toLocaleString('es-CO')} COP` : '';

                acumuladoHTML += `
                    <div class="orden-card ${estaCompletada ? 'completada' : ''}">
                        <div class="cliente-tag">👤 ${cliente}</div>
                        <h3 style="margin-top: 0; color: #052659;">Orden #${index + 1}</h3>
                        <div class="cliente-info">🕒 Recibido: ${hora}</div>
                        <ul class="lista-platos">
                            ${itemsHTML}
                        </ul>
                        ${total ? `<div class="total-pedido">Total: ${total}</div>` : ''}
                        <button class="btn-despachar ${estaCompletada ? 'btn-completado' : ''}" 
                                onclick="alternarEstadoOrden(${index})">
                            ${estaCompletada ? '✓ Completado (Deshacer)' : 'Despachar Pedido ✓'}
                        </button>
                        <button class="btn-eliminar" onclick="eliminarOrden(${index})">Eliminar Comanda</button>
                    </div>
                `;
            });

            contenedor.innerHTML = acumuladoHTML;
        }

        function alternarEstadoOrden(index) {
            ordenesPendientes[index].completada = !ordenesPendientes[index].completada;
            guardarYRenderizar();
        }

        function eliminarOrden(index) {
            if (confirm("¿Estás seguro de eliminar esta comanda?")) {
                ordenesPendientes.splice(index, 1);
                guardarYRenderizar();
            }
        }

        function limpiarTodosLosPedidos() {
            if (confirm("⚠️ ¿Deseas borrar TODOS los pedidos recibidos?")) {
                ordenesPendientes = [];
                guardarYRenderizar();
            }
        }

        function guardarYRenderizar() {
            localStorage.setItem('pedidosMivith', JSON.stringify(ordenesPendientes));
            renderizarOrdenes();
        }

        function buscarNuevasOrdenes() {
            ordenesPendientes = JSON.parse(localStorage.getItem('pedidosMivith')) || [];
            renderizarOrdenes(); 
        }

        function cerrarSesion() {
            sessionStorage.removeItem('adminAutenticado');
            window.location.href = "../index.html";
        }

        renderizarOrdenes();
        setInterval(buscarNuevasOrdenes, 3000);
    </script>
</body>
</html>
